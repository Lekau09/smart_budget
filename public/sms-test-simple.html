<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Direct Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-preset {
            background: #e5e7eb;
            color: #374151;
        }
        
        .btn-preset:hover {
            background: #d1d5db;
        }
        
        .btn-submit {
            grid-column: 1 / -1;
            background: #667eea;
            color: white;
            padding: 14px;
        }
        
        .btn-submit:hover {
            background: #5568d3;
        }
        
        .success, .error {
            padding: 12px;
            margin: 20px 0;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        
        .success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .info-box {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 SMS Test</h1>
        <div class="subtitle">Send test SMS directly to database</div>
        
        <div class="info-box">
            ℹ️ This form inserts SMS directly into the database for testing. Uses user_id 16 (phonyo@gmail.com).
        </div>
        
        <form id="smsForm">
            <div class="form-group">
                <label for="smsFrom">SMS From (Sender Number)</label>
                <input type="text" id="smsFrom" value="+26652000002" required>
            </div>
            
            <div class="form-group">
                <label for="smsText">SMS Text</label>
                <textarea id="smsText" placeholder="Enter SMS message..." required></textarea>
            </div>
            
            <label style="margin-bottom: 12px;">Quick Presets:</label>
            <div class="buttons">
                <button type="button" class="btn-preset" onclick="setPreset('balance')">📊 Balance</button>
                <button type="button" class="btn-preset" onclick="setPreset('transfer')">💸 Transfer</button>
                <button type="button" class="btn-preset" onclick="setPreset('airtime')">📞 Airtime</button>
                <button type="button" class="btn-preset" onclick="setPreset('payment')">💳 Payment</button>
            </div>
            
            <button type="submit" class="btn-submit">✉️ Send SMS to Database</button>
            
            <div id="successMsg" class="success"></div>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>
    
    <script>
        const presets = {
            balance: 'Your account balance is 5000.00 BWP. Available for withdrawal: 4800.00 BWP',
            transfer: 'You have received 2000.00 BWP from John Doe. Reference: TRF123456',
            airtime: 'You have successfully purchased P50.00 airtime. Balance: P123.45',
            payment: 'Payment of 1500.00 BWP to Electricity Board confirmed. Reference: PAY789456'
        };
        
        function setPreset(type) {
            document.getElementById('smsText').value = presets[type];
        }
        
        document.getElementById('smsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const smsFrom = document.getElementById('smsFrom').value;
            const smsText = document.getElementById('smsText').value;
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            try {
                const timestamp = Math.floor(Date.now());
                
                // Send to backend to insert directly into database
                // Use localhost:80 for API calls (Apache backend)
                const url = 'http://localhost/smart_budget/backend/api/test-sms-insert.php';
                const payload = {
                    user_id: 16,
                    sms_from: smsFrom,
                    sms_text: smsText,
                    sent_stamp: timestamp,
                    received_stamp: timestamp,
                    sim_slot: 'SIM1'
                };
                
                console.log('Fetching:', url, payload);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    successMsg.innerHTML = '✅ <strong>SMS added to database!</strong><br>Check the logs viewer to see it.<br><br>' +
                        '<a href="/smart_budget/view-sms-logs.html" target="_blank" style="color: #065f46; text-decoration: underline;">View Logs →</a>';
                    successMsg.style.display = 'block';
                    document.getElementById('smsForm').reset();
                    document.getElementById('smsFrom').value = '+26652000002';
                } else {
                    throw new Error(data.message || 'Failed to add SMS');
                }
            } catch (err) {
                errorMsg.textContent = '❌ Error: ' + err.message;
                errorMsg.style.display = 'block';
                console.error('Full error:', err);
            }
        });
    </script>
</body>
</html>
